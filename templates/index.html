<!DOCTYPE html>
<html>

<head>

<title>Plant Occurrence & Climate Dashboard</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

body{
font-family: Arial, Helvetica, sans-serif;
margin:0;
padding:0;
}

h2{
padding:10px;
background:#2c3e50;
color:white;
margin:0;
}

.container{
display:flex;
height:90vh;
}

.panel{
padding:15px;
overflow:auto;
}

.left-panel{
width:250px;
border-right:1px solid #ddd;
background:#f7f7f7;
}

.map-panel{
flex:1;
padding:10px;
}

.right-panel{
width:420px;
border-left:1px solid #ddd;
background:#fafafa;
}

button{
margin-top:5px;
padding:6px 10px;
cursor:pointer;
}

#leaflet-map{
height:650px;
width:100%;
border:1px solid #ccc;
}

table{
width:100%;
border-collapse:collapse;
font-size:12px;
}

table th, table td{
border:1px solid #ccc;
padding:5px;
text-align:left;
}

table th{
background:#eaeaea;
}

.status{
font-size:12px;
color:#444;
margin-bottom:10px;
}

pre{
white-space:pre-wrap;
font-size:11px;
}

</style>

</head>

<body>

<h2>Plant Occurrence Dashboard (GBIF + Climate)</h2>

<div class="container">

<!-- LEFT PANEL -->

<div class="panel left-panel">

<h3>Upload Plant List</h3>

<input type="file" id="file-input"/>
<button onclick="uploadFile()">Upload CSV</button>

<p id="upload-status" class="status"></p>

<hr>

<button onclick="fetchGbifData()">Fetch Occurrences</button>
<p id="fetch-status" class="status"></p>

<hr>

<button onclick="calculateClimate()">Get Climate Data (5 points)</button>

</div>


<!-- MAP PANEL -->

<div class="panel map-panel">

<h3>Occurrence Map</h3>

<div id="leaflet-map"></div>

<button style="margin-top:10px" onclick="loadLeafletPoints()">
Reload Map Points
</button>

</div>


<!-- RIGHT PANEL -->

<div class="panel right-panel">

<h3>Climate API Results</h3>

<table id="climate-table">

<thead>
<tr>
<th>Latitude</th>
<th>Longitude</th>
<th>Plant</th>
<th>Climate API Result</th>
</tr>
</thead>

<tbody></tbody>

</table>

</div>

</div>

<script src="/static/js/main.js"></script>

</body>
</html>
